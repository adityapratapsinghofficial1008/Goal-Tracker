<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="favGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="25%" stop-color="#DFAC42"/>
      <stop offset="50%" stop-color="#C68C27"/>
      <stop offset="75%" stop-color="#FCEBA2"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <linearGradient id="favGoldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="40%" stop-color="#FCEEA7"/>
      <stop offset="60%" stop-color="#FFFAD6"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="favGoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996D1D"/>
      <stop offset="50%" stop-color="#543A0B"/>
      <stop offset="100%" stop-color="#2C1D04"/>
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g transform="translate(0, 10)" filter="url(#favShadow)">
    <!-- Outer Dial Rim -->
    <path d="M 75,240 A 140,140 0 1,1 315,230" 
          fill="none" stroke="url(#favGoldMetallic)" stroke-width="14" stroke-linecap="round"/>

    <!-- Clock Ticks -->
    <line x1="115" y1="110" x2="102" y2="96" stroke="url(#favGoldHighlight)" stroke-width="6" stroke-linecap="round"/>
    <line x1="170" y1="75" x2="168" y2="55" stroke="url(#favGoldHighlight)" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="75" x2="235" y2="56" stroke="url(#favGoldHighlight)" stroke-width="6" stroke-linecap="round"/>
    <line x1="68" y1="180" x2="48" y2="178" stroke="url(#favGoldHighlight)" stroke-width="6" stroke-linecap="round"/>

    <circle cx="238" cy="57" r="7" fill="url(#favGoldHighlight)"/>
    <circle cx="101" cy="95" r="5" fill="url(#favGoldHighlight)"/>

    <!-- Gauge Ticks -->
    <path d="M 318,180 A 140,140 0 0,1 280,295" 
          fill="none" stroke="url(#favGoldMetallic)" stroke-width="9" stroke-linecap="round" stroke-dasharray="10 12"/>

    <!-- Inner Concentric Dial Arc -->
    <path d="M 130,250 A 90,90 0 1,1 270,140" 
          fill="none" stroke="url(#favGoldHighlight)" stroke-width="10" stroke-linecap="round"/>
    
    <path d="M 160,255 A 65,65 0 0,0 255,220" 
          fill="none" stroke="url(#favGoldMetallic)" stroke-width="7" stroke-linecap="round"/>

    <!-- Dynamic 3D Gold Arrow & Trend Lines -->
    <polygon points="70,290 100,290 165,155 140,155" fill="url(#favGoldHighlight)"/>
    <polygon points="100,290 118,270 165,155" fill="url(#favGoldShadow)"/>

    <polygon points="165,155 220,235 195,250 140,155" fill="url(#favGoldMetallic)"/>
    <polygon points="220,235 235,220 195,250" fill="url(#favGoldShadow)"/>

    <polygon points="195,250 300,95 325,108 220,235" fill="url(#favGoldHighlight)"/>
    <polygon points="220,235 300,95 280,90 195,250" fill="url(#favGoldShadow)"/>

    <!-- Arrowhead -->
    <polygon points="270,120 345,60 315,125 298,105" fill="url(#favGoldHighlight)"/>
    <polygon points="345,60 325,145 315,125" fill="url(#favGoldShadow)"/>
    <polyline points="270,120 345,60 315,125" fill="none" stroke="#FFFAD6" stroke-width="2"/>
  </g>
</svg>