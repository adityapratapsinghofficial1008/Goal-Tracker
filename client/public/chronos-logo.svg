<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Primary Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="20%" stop-color="#DFAC42"/>
      <stop offset="45%" stop-color="#C68C27"/>
      <stop offset="60%" stop-color="#FCEBA2"/>
      <stop offset="80%" stop-color="#B37C1E"/>
      <stop offset="100%" stop-color="#67470E"/>
    </linearGradient>

    <!-- Light Gold Metallic Gradient for Highlights -->
    <linearGradient id="goldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="35%" stop-color="#FCEEA7"/>
      <stop offset="50%" stop-color="#FFFAD6"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <!-- Dark Gold Shadow Gradient -->
    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996D1D"/>
      <stop offset="50%" stop-color="#543A0B"/>
      <stop offset="100%" stop-color="#2C1D04"/>
    </linearGradient>

    <!-- Radial Gold Glow for Center -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCEEA7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Metallic Depth -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#FFFAD6" flood-opacity="0.5"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="180" r="150" fill="url(#goldGlow)"/>

  <!-- LOGO ICON MARK (Centered at cx=250, cy=180) -->
  <g filter="url(#goldDropShadow)">
    
    <!-- Outer Dial Rim / Clock Notch Ring -->
    <!-- Arc from ~200 deg to 40 deg -->
    <path d="M 125,230 
             A 140,140 0 1,1 365,220" 
          fill="none" stroke="url(#goldMetallic)" stroke-width="12" stroke-linecap="round"/>

    <!-- Clock Notches along Outer Arc -->
    <!-- Notch 1 (top-left) -->
    <line x1="165" y1="100" x2="152" y2="86" stroke="url(#goldHighlight)" stroke-width="5" stroke-linecap="round"/>
    <!-- Notch 2 (top) -->
    <line x1="220" y1="65" x2="218" y2="45" stroke="url(#goldHighlight)" stroke-width="5" stroke-linecap="round"/>
    <!-- Notch 3 (top-mid-right) -->
    <line x1="280" y1="65" x2="285" y2="46" stroke="url(#goldHighlight)" stroke-width="5" stroke-linecap="round"/>
    <!-- Notch 4 (mid-left) -->
    <line x1="118" y1="170" x2="98" y2="168" stroke="url(#goldHighlight)" stroke-width="5" stroke-linecap="round"/>

    <!-- Circuit Dot / Node on Outer Arc -->
    <circle cx="288" cy="47" r="7" fill="url(#goldHighlight)"/>
    <circle cx="151" cy="85" r="5" fill="url(#goldHighlight)"/>

    <!-- Right Outer Arc Block Ticks (Gauge style) -->
    <path d="M 368,170 A 140,140 0 0,1 330,285" 
          fill="none" stroke="url(#goldMetallic)" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 12"/>

    <!-- Inner Concentric Dial Arc -->
    <path d="M 180,240 
             A 90,90 0 1,1 320,130" 
          fill="none" stroke="url(#goldHighlight)" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Second Inner Ring Segment -->
    <path d="M 210,245 A 65,65 0 0,0 305,210" 
          fill="none" stroke="url(#goldMetallic)" stroke-width="6" stroke-linecap="round"/>

    <circle cx="318" cy="192" r="6" fill="url(#goldMetallic)"/>

    <!-- DYNAMIC CENTRAL UPWARD ARROW / TREND MARK (FACETED 3D GOLD) -->
    
    <!-- Bottom-Left Leg to First Elbow -->
    <polygon points="120,280 150,280 215,145 190,145" fill="url(#goldHighlight)"/>
    <polygon points="150,280 168,260 215,145" fill="url(#goldShadow)"/>

    <!-- Middle Diurnal Step / Zig-Zag Band (Down-Right Trough) -->
    <polygon points="215,145 270,225 245,240 190,145" fill="url(#goldMetallic)"/>
    <polygon points="270,225 285,210 245,240" fill="url(#goldShadow)"/>

    <!-- Main Upward Shaft shooting to Top Right Arrowhead -->
    <polygon points="245,240 350,85 375,98 270,225" fill="url(#goldHighlight)"/>
    <polygon points="270,225 350,85 330,80 245,240" fill="url(#goldShadow)"/>

    <!-- LARGE 3D ARROWHEAD (Pointing Top-Right) -->
    <!-- Left Flange of Arrowhead -->
    <polygon points="320,110 395,50 365,115 348,95" fill="url(#goldHighlight)"/>
    <!-- Right Flange of Arrowhead -->
    <polygon points="395,50 375,135 365,115" fill="url(#goldShadow)"/>
    <!-- Arrow Ridge Center Highlight -->
    <polyline points="320,110 395,50 365,115" fill="none" stroke="#FFFAD6" stroke-width="2"/>

  </g>

  <!-- LOGO TEXT SECTION -->
  <g filter="url(#goldDropShadow)">
    <!-- Primary Title: CHRONOS -->
    <text x="250" y="420" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Montserrat', serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="12" 
          fill="url(#goldMetallic)" 
          text-anchor="middle">
      CHRONOS
    </text>
    
    <!-- Title Facet Highlight Line -->
    <text x="250" y="419" 
          font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Montserrat', serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="12" 
          fill="none"
          stroke="#FFFAD6"
          stroke-width="1"
          stroke-opacity="0.6"
          text-anchor="middle">
      CHRONOS
    </text>

    <!-- Subtitle: GOAL TRACKER -->
    <text x="250" y="465" 
          font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" 
          font-size="24" 
          font-weight="700" 
          letter-spacing="16" 
          fill="url(#goldHighlight)" 
          text-anchor="middle">
      GOAL TRACKER
    </text>
  </g>
</svg>
